# =====================================================================
# Configuración del pipeline — Pronóstico horario de ozono en Lima
# Todas las decisiones metodológicas del manuscrito están aquí.
# Cambie valores aquí, no en el código.
# =====================================================================

data:
  dir: data                       # carpeta con los CSV (relativa a este archivo)
  stations:                       # código de estación -> archivo
    ATE: ozono_ate.csv
    CDM: ozono_cdm.csv
    SB:  ozono_sb.csv
    STA: ozono_sta.csv
  time_col: time
  time_format: "%d/%m/%Y %H:%M"
  target: ozono                   # µg/m3
  covariates: [temp, humrel, velvie, dirvie]
  impute_if_missing: true         # MICE (IterativeImputer) solo si hay NaN en el CSV

output_dir: outputs
seed: 2026
n_jobs: 4                         # estaciones en paralelo (1 = secuencial)

transform: log                    # log | none
bias_correction: false            # true: exp(mu + s2/2) al retransformar

split:
  test_hours: 1368                # últimas 1368 h (≈20 %)
  n_windows: 5                    # ventanas de origen móvil dentro del test
  val_fraction: 0.10              # hold-out temporal (final del 1.er entrenamiento) para hiperparámetros

decomposition:
  trend: true                     # tendencia en tiempo real (años desde el inicio; respeta los huecos entre inviernos)
  year_dummies: true              # se omite 2017 como referencia (evita colinealidad con el intercepto)
  dow_dummies: true               # domingo = referencia
  hour_dummies: true              # hora 0 = referencia

lags:
  select: bic                     # bic | fixed
  max_p: 48
  fixed_p: 5                      # usado solo si select = fixed
  drop_cross_season: true         # descarta muestras cuyos rezagos cruzan de un invierno al siguiente

models:
  ELM:
    hidden_grid: [10, 20, 50, 100, 200]
    n_seeds: 20                   # ensamble de inicializaciones aleatorias (se promedia)
    weight_low: -1.0
    weight_high: 1.0
    ridge_grid: [0.0, 0.01, 1.0]  # 0 = pseudoinversa de Moore–Penrose pura; >0 = ELM regularizado
                                  # (se elige en el hold-out; use [0.0] para replicar el diseño original)
  MLP:
    hidden_grid: [1, 3, 5, 7]
    solver: lbfgs                 # lbfgs | adam
    max_iter: 1000
    alpha: 1.0e-4                 # penalización L2
    n_seeds: 3
  NPAR:                           # AR aditivo no paramétrico: splines cúbicas por rezago
    n_knots: 6
    degree: 3
    alpha_grid: [0.01, 0.1, 1.0, 10.0]
  RF:
    n_estimators: 300
    max_depth_grid: [10, None]
    min_samples_leaf_grid: [5, 20]
  XGB:
    backend: hgb        # hgb = HistGradientBoosting de scikit-learn (manuscrito); xgboost = librería XGBoost
    n_estimators: 400
    max_depth_grid: [3, 6]
    learning_rate_grid: [0.03, 0.1]
  GRU:
    hidden_grid: [16, 32]
    epochs: 60
    patience: 6
    lr: 0.001
    n_seeds: 1
  LSTM:
    hidden_grid: [16, 32]
    epochs: 60
    patience: 6
    lr: 0.001
    n_seeds: 1
  SARIMA:                         # contraste estacional explícito (Obs. Soria-01)
    enabled: true
    order: [1, 1]                 # (p, q); d = 0
    seasonal_order: [1, 1]        # (P, Q); D = 0
    period: 24
    refit_each_origin: false      # parámetros del primer entrenamiento, aplicados con la información de cada origen
  ARIMA:
    max_p: 4
    max_q: 4
    criterion: aic                # aic | bic (un solo criterio en todo el manuscrito)
    reselect_each_origin: false   # true: reelige (p,q) en cada origen (más lento)

# modelos del componente estocástico (además de ARIMA y SARIMA)
stochastic_models: [ELM, MLP, NPAR, RF, XGB, GRU, LSTM]

baselines: [Naive, SNaive24, SNaive168]

horizons: [1, 6, 12, 24, 48]      # h = 1 es el análisis principal; 12-48 h responden al revisor

multivariate:
  enabled: true
  models: [ELM, MLP]
  covariates: [temp, humrel, velvie, dirvie]
  cov_lags: [1, 2, 3]             # 1 = valor en el origen del pronóstico
  wind_direction_col: dirvie      # se codifica como seno/coseno

metrics:
  mase_scale: train_naive         # train_naive | train_snaive24  (Hyndman & Koehler, 2006)
  near_zero_threshold: 2.0        # µg/m3, para diagnosticar MAPE

dm:
  loss: absolute                  # absolute | squared
  hac_lags: 24                    # varianza HAC (Bartlett) robusta a autocorrelación
  holm: true                      # corrección de Holm por comparaciones múltiples

diurnal:
  day_hours: [10, 16]             # ventana fotoquímica (inclusive)

# Generalización con la data disponible (responde a "ampliar el dataset")
generalization:
  enabled: true
  horizons: [1, 24]               # deben estar también en `horizons` (reusa los hiperparámetros elegidos)
  models: [ELM, MLP, NPAR]
  cross_winter: true              # entrenar con inviernos previos y probar en un invierno completo no visto
  cross_winter_decomposition:     # un año no visto no tiene dummy de año: solo calendario intra-anual
    trend: false
    year_dummies: false
    dow_dummies: true
    hour_dummies: true
  cross_station: true             # entrenar en una estación (o en las cuatro juntas) y aplicar en otra

# Ajustes que aplica la opción --fast (prueba de humo, NO para el manuscrito)
fast:
  horizons: [1, 6]
  generalization: {horizons: [1]}
  models:
    ELM:  {hidden_grid: [20, 50], ridge_grid: [0.0, 1.0], n_seeds: 3}
    MLP:  {hidden_grid: [3], n_seeds: 1, max_iter: 200}
    NPAR: {alpha_grid: [1.0]}
    RF:   {n_estimators: 50, max_depth_grid: [10], min_samples_leaf_grid: [20]}
    XGB:  {n_estimators: 100, max_depth_grid: [3], learning_rate_grid: [0.1]}
    GRU:  {hidden_grid: [16], epochs: 5}
    LSTM: {hidden_grid: [16], epochs: 5}
    ARIMA: {max_p: 2, max_q: 2}
